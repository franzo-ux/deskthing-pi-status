<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi Status</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14110c; color: #fff; overflow: hidden; height: 100vh;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* ---------- status (style B) ---------- */
  .app { display: flex; height: 100vh; transition: background .6s; }
  .app.busy { background: radial-gradient(circle at 25% 50%, #3a2a12 0%, #14110c 70%); }
  .app.idle { background: radial-gradient(circle at 25% 50%, #12283a 0%, #0c1116 70%); }
  .app.offline { background: radial-gradient(circle at 25% 50%, #3a1212 0%, #140c0c 70%); }
  .app.wait { background: #111; }

  .left {
    width: 46%; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding-bottom: 6px;
  }
  .logo { position: absolute; top: 14px; left: 16px; }
  .big { font-size: 84px; font-weight: 800; line-height: 1; margin-top: 8px; }
  .busy .big { color: #F1BE58; }
  .idle .big { color: #4D9ABF; }
  .offline .big { color: #F09082; }
  .lbl { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; opacity: .85; }
  .track { position: relative; width: 92%; height: 152px; margin-top: 8px; border-bottom: 3px solid rgba(255,255,255,.12); }
  .robot { position: absolute; left: 0; bottom: 0; will-change: transform; }
  .frame { display: none; }
  .frame svg { display: block; }

  /* The Car Thing knob covers the right edge of the screen: keep text clear of it. */
  .right { flex: 1; padding: 18px 84px 18px 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  #list { overflow-y: auto; }
  .row { display: flex; align-items: center; font-size: 22px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sq { width: 16px; height: 16px; border-radius: 3px; margin-right: 14px; flex-shrink: 0; }
  .row.busy .sq { background: #F1BE58; animation: pulse 1s ease-in-out infinite; }
  .row.fin .sq { background: #4D9ABF; }
  .row.wait .sq { background: #555; }
  @keyframes pulse { 50% { opacity: .3; } }
  .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }
  .row.busy .label { color: #fde7b0; font-weight: 700; }
  .tm { font-size: 17px; color: #b9b2a5; white-space: nowrap; }
  .empty { font-size: 20px; opacity: .6; text-align: center; }

  /* ---------- done overlay (style C) ---------- */
  .done {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none;
    background: #0b0f0c; color: #c8f7c5; font-family: "DejaVu Sans Mono", Consolas, monospace;
    padding-right: 70px; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .done.show { display: flex; }
  .box {
    border: 3px double #F1BE58; padding: 22px 36px; max-width: 92%;
    animation: blink 0.5s steps(1) 6;
  }
  @keyframes blink { 50% { border-color: transparent; } }
  .box .h { font-size: 40px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box .h b { color: #F1BE58; }
  #done-time { font-size: 22px; color: #7d8b7b; margin-top: 10px; }
  .hint { font-size: 15px; color: #5c6b5a; margin-top: 18px; }

  .count { display: flex; flex-direction: column; align-items: center; }

  /* ---------- "Pi is asking you something": glitch ---------- */
  .app.ask { background: radial-gradient(circle at 25% 50%, #3a1238 0%, #120b16 70%); }
  .ask .big { color: #F09082; animation: gtext 1.1s steps(1) infinite; }
  .ask .lbl { animation: gtext 1.7s steps(1) infinite; }
  @keyframes gtext {
    0%, 100% { text-shadow: 2px 0 rgba(255,40,100,.9), -2px 0 rgba(0,230,255,.9); transform: none; }
    20% { text-shadow: -4px 0 rgba(255,40,100,.9), 3px 0 rgba(0,230,255,.9); transform: translateX(2px) skewX(-6deg); }
    40% { text-shadow: 1px 0 rgba(255,40,100,.9), -1px 0 rgba(0,230,255,.9); transform: none; }
    62% { text-shadow: 5px 0 rgba(255,40,100,.9), -5px 0 rgba(0,230,255,.9); transform: translateX(-3px); }
    80% { text-shadow: 0 0 transparent; transform: none; }
  }
  .row.ask .sq { background: #F09082; animation: pulse .45s steps(1) infinite; }
  .row.ask .label { color: #ffc2d8; font-weight: 700; }
  .row.ask .tm { color: #F09082; }

  .slice { position: absolute; left: 0; top: 0; display: none; pointer-events: none; }
  .glitch .slice { display: block; }
  .glitch .slice.s1 { filter: sepia(1) saturate(8) hue-rotate(300deg); opacity: .85; }
  .glitch .slice.s2 { filter: sepia(1) saturate(8) hue-rotate(140deg); opacity: .85; }
  .glitch .frame { animation: gjit .42s steps(1) infinite; }
  .glitch .frame svg, .glitch .frame img {
    filter: drop-shadow(3px 0 0 rgba(255,40,100,.85)) drop-shadow(-3px 0 0 rgba(0,230,255,.85));
  }
  @keyframes gjit {
    0% { transform: none; opacity: 1; }
    15% { transform: translate(-3px, 1px) skewX(4deg); }
    30% { transform: translate(2px, 0); opacity: .75; }
    45% { transform: none; opacity: 1; }
    70% { transform: translate(4px, -1px) skewX(-6deg); }
    85% { transform: translate(-1px, 0); opacity: .6; }
  }
  .glitch::after {
    content: ""; position: absolute; left: -6px; right: -6px; top: -10px; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0, rgba(0,0,0,.28) 2px, transparent 2px, transparent 4px);
    animation: flicker 2.3s steps(1) infinite;
  }
  @keyframes flicker { 0%, 100% { opacity: .55; } 48% { opacity: .9; } 52% { opacity: .25; } 75% { opacity: .7; } }
  .p-ask img { border-color: #F09082; animation: gjit .42s steps(1) infinite;
    filter: drop-shadow(4px 0 0 rgba(255,40,100,.8)) drop-shadow(-4px 0 0 rgba(0,230,255,.8)); }

  /* ---------- Homelab alert banner (before switching app) ---------- */
  .alert {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: none; z-index: 20;
    flex-direction: column; align-items: center; justify-content: center; padding-right: 70px;
    background: #12070c; color: #ffb3a6; font-family: "DejaVu Sans Mono", Consolas, monospace; text-align: center;
  }
  .alert.show { display: flex; animation: gjit .3s steps(1) infinite; }
  .alert::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0, rgba(0,0,0,.35) 2px, transparent 2px, transparent 4px);
  }
  #alert-text { font-size: 30px; font-weight: 700; max-width: 92%;
    text-shadow: 3px 0 rgba(255,40,100,.9), -3px 0 rgba(0,230,255,.9); animation: gtext .6s steps(1) infinite; }
  .alert-sub { margin-top: 10px; font-size: 16px; letter-spacing: 4px; text-transform: uppercase; color: #F09082; }
</style>
</head>
<body>
  <div id="app" class="app wait">
    <div class="left">
      <svg class="logo" width="34" height="34" viewBox="165 165 470 470"><path fill="#F09082" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"/><path fill="#4D9ABF" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"/><path fill="#F1BE58" d="M517.36 400H634.72V634.72H517.36Z"/></svg>
      <div class="count"><div id="big" class="big">…</div><div id="lbl" class="lbl">collegamento</div></div>
      <div id="track" class="track"><div id="robot" class="robot"></div></div>
    </div>
    <div class="right"><div id="list"></div></div>
  </div>
  <div id="alert" class="alert"><div id="alert-text"></div><div class="alert-sub">Homelab</div></div>
  <div id="done" class="done">
    <div class="box">
      <div class="h"><b>✓ DONE:</b> <span id="done-label"></span></div>
      <div id="done-time"></div>
    </div>
    <div class="hint">tocca per chiudere</div>
  </div>
  <script src="./main.js"></script>
</body>
</html>
